services:
  postgres:
    image: postgres:16-alpine
    container_name: wow-forever-companion-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wow_forever_companion}
      POSTGRES_USER: ${POSTGRES_USER:-wow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wow_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wow} -d ${POSTGRES_DB:-wow_forever_companion}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

